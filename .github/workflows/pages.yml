# Publica o simulador e a montagem 3D no GitHub Pages a cada push na main.
# O site é montado em _site/ a partir de site/index.html e das páginas em docs/.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp docs/ilustracao-3d.html _site/simulador.html
          cp docs/montagem-3d.html _site/montagem.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
